# DCS Season 3 rulebook (undated). Matches the description of the old 2-ban format.
# It runs the standard flow (captain vote, side claim, Hidden King "first"); only the timers and
# the hero order come from this mode. Timers are judgement placeholders.
schema_version: 1
slug: dcs_s3_2ban
name: "2-ban draft (DCS Season 3)"
provenance:
  source: "collegedeadlock.com/rules/season-3"
  night_shift_status: not_night_shift
team_size: 6
ready_check: { seconds: 180, backfill: next_in_queue }
captains: { vote_seconds: 45 }
player_draft: { order: FSSFFSSFFS, seconds: 45, on_timeout: auto_highest_rating }
champion_draft:
  side_seconds: 20
  seconds: 30
  excluded_champion_ids: []
  steps:
    - { action: ban, team: first }
    - { action: ban, team: second }
    - { action: pick, team: first }
    - { action: pick, team: second, count: 2 }
    - { action: pick, team: first, count: 2 }
    - { action: pick, team: second }
    - { action: ban, team: second }
    - { action: ban, team: first }
    - { action: pick, team: second }
    - { action: pick, team: first, count: 2 }
    - { action: pick, team: second, count: 2 }
    - { action: pick, team: first }
lobby_code: { seconds: 180 }
results: { confirm_window_seconds: 300, reminder_minutes: 45, staff_escalation_minutes: 180 }
