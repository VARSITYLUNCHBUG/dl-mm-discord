# The 18-step table from the 1win rulebook, section 6.5.5.
# Night Shift confirms 6v6, 3 bans per team since #62 (2026-10-28) and two opening ban rounds, but
# NOT this exact order. Replace it with a new version if a Night Shift source differs.
# It runs the standard flow (captain vote, side claim, Hidden King "first"); only the timers and
# the hero order come from this mode. Timers are judgement placeholders: the real 1win and Night
# Shift values are unknown.
schema_version: 1
slug: threeban_1win_2026
name: "3-ban draft (1win table; Night Shift candidate)"
provenance:
  source: "1win rulebook s6.5.5"
  night_shift_status: candidate_unconfirmed
team_size: 6
ready_check: { seconds: 180, backfill: next_in_queue }
captains: { vote_seconds: 45 }
player_draft: { order: FSSFFSSFFS, seconds: 45, on_timeout: auto_highest_rating }
champion_draft:
  side_seconds: 20
  seconds: 30
  excluded_champion_ids: []
  steps:
    - { action: ban, team: first }
    - { action: ban, team: second }
    - { action: ban, team: first }
    - { action: ban, team: second }
    - { action: pick, team: first }
    - { action: pick, team: second, count: 2 }
    - { action: pick, team: first }
    - { action: pick, team: second }
    - { action: pick, team: first }
    - { action: ban, team: second }
    - { action: ban, team: first }
    - { action: pick, team: second }
    - { action: pick, team: first, count: 2 }
    - { action: pick, team: second }
    - { action: pick, team: first }
    - { action: pick, team: second }
lobby_code: { seconds: 180 }
results: { confirm_window_seconds: 300, reminder_minutes: 45, staff_escalation_minutes: 180 }
