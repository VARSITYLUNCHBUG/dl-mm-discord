[project]
name = "dl-mm-discord"
version = "1.0.0"
description = "Discord bot that runs queue, captain draft, champion pick/ban and Elo for 6v6 Deadlock."
requires-python = ">=3.13,<3.14"
dependencies = [
    "dj-database-url>=2.3,<4",
    "discord.py>=2.7,<2.8",
    "django>=5.2,<5.3",
    "gunicorn>=23",
    "httpx>=0.28",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pyyaml>=6",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2",
    "hypothesis>=2.0",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-django>=4.10",
    "ruff>=0.11",
    "types-pyyaml>=6",
]
ocr = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "pillow>=13.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["league/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django Meta options are class-level by design.
"league/models/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["league/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
